{% extends "base.html" %}
{% block content %}
<div class="hero admin-hero"><div><h2>✏️ Edit Payment / पेमेंट बदला</h2><p>{{payment.name}} • Roll No: {{payment.roll}}</p></div><a class="btn light-btn" href="/admin/student?q={{payment.roll}}">← Back</a></div>
<div class="card narrow">
  <form method="post" class="form-grid">
    <label>Month / महिना<input name="paid_month" type="month" value="{{payment.paid_month or ''}}" required></label>
    <label>Date / तारीख<input name="paid_date" type="date" value="{{payment.paid_date}}" required></label>
    <label>Amount / रक्कम<input name="amount" type="number" step="0.01" value="{{payment.amount}}" required></label>
    <label>Payment Mode / पद्धत<select name="payment_mode"><option value="Cash" {% if payment.payment_mode=='Cash' %}selected{% endif %}>Cash</option><option value="UPI" {% if payment.payment_mode=='UPI' %}selected{% endif %}>UPI</option><option value="Bank Transfer" {% if payment.payment_mode=='Bank Transfer' %}selected{% endif %}>Bank Transfer</option><option value="Other" {% if payment.payment_mode=='Other' %}selected{% endif %}>Other</option></select></label>
    <label>Note<input name="note" value="{{payment.note or ''}}" placeholder="Note"></label>
    <button type="submit">💾 Save Changes</button>
  </form>
</div>
{% endblock %}
