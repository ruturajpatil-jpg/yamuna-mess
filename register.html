{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>📝 Student Registration / विद्यार्थी नोंदणी</h2>
  <form method="post" enctype="multipart/form-data">
    <input name="name" placeholder="Student Name / विद्यार्थी नाव" required>
    <input name="roll" placeholder="Roll No" required>
    <input name="username" placeholder="Username / यूजरनेम" required>
    <input name="password" type="password" placeholder="Password / पासवर्ड" required>
    <input name="phone" placeholder="Mobile Number">
    <input name="course" placeholder="Course / Branch">
    <label class="file-label">📸 Student Photo / फोटो<input type="file" name="photo" accept="image/*"></label>
    <button type="submit">Register / नोंदणी करा</button>
  </form>
  <a class="btn secondary full-btn" href="/login">← Login / लॉगिन</a>
</div>
{% endblock %}
