{% extends "base.html" %}
{% block content %}<div class="card narrow"><h2>✏️ Edit Student / विद्यार्थी माहिती बदला</h2><form method="post" enctype="multipart/form-data"><input name="name" value="{{student.name}}" placeholder="Name" required><input name="roll" value="{{student.roll}}" placeholder="Roll" required><input name="username" value="{{student.username or ''}}" placeholder="Username" required><input name="password" type="password" placeholder="New Password (blank = keep current)"><input name="phone" value="{{student.phone or ''}}" placeholder="Mobile"><input name="course" value="{{student.course or ''}}" placeholder="Course"><label class="file-label">📸 Change Photo<input type="file" name="photo" accept="image/*"></label>{% if student.photo_data %}<input type="hidden" name="keep_photo" value="1"><img class="edit-photo" src="{{student.photo_data}}">{% endif %}<button>Save Changes / बदल जतन करा</button><a class="btn secondary" href="/admin">Cancel</a></form></div>{% endblock %}
