{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>✏️ Edit Student / विद्यार्थी माहिती बदला</h2>

  <form method="post" enctype="multipart/form-data">
    <input name="name" value="{{student.name}}" placeholder="Name" required>
    <input name="roll" value="{{student.roll}}" placeholder="Roll" required>
    <input name="username" value="{{student.username or ''}}" placeholder="Username" required>
    <input name="password" type="password" placeholder="New Password (blank = keep current)">
    <input name="phone" value="{{student.phone or ''}}" placeholder="Mobile">
    <input name="course" value="{{student.course or ''}}" placeholder="Course">

    <label class="file-label">
      📸 Change Photo
      <input type="file" name="photo" accept="image/*">
    </label>

    {% if student.photo_data %}
      <input type="hidden" name="keep_photo" value="1">
      <img class="edit-photo" src="{{student.photo_data}}">
    {% endif %}

    <button>Save Changes / बदल जतन करा</button>
    <a class="btn secondary" href="/admin">Cancel</a>
  </form>

  <hr style="margin:22px 0;">

  <form method="post"
        action="{{ url_for('delete_student', student_id=student.id) }}"
        onsubmit="return confirm('हा विद्यार्थी आणि त्याची Attendance व Payment records कायमचे remove करायचे आहेत का? / Remove this student and all records?');">
    <button type="submit"
            style="width:100%; background:#b91c1c; color:white; border:0; padding:12px 16px; border-radius:10px; font-weight:700; cursor:pointer;">
      🗑️ Remove Student / विद्यार्थी Remove करा
    </button>
  </form>
</div>
{% endblock %}
